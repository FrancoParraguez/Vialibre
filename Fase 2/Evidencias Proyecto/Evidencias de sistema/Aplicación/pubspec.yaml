name: via_libre
description: Plataforma de geolocalización en tiempo real con geofencing predictivo para optimizar tiempos de respuesta de vehículos de emergencia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.4
  firebase_database: ^10.5.7

  # Mapas y geolocalización
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Notificaciones locales (para mostrar alertas en foreground)
  flutter_local_notifications: ^17.2.3

  # Permisos
  permission_handler: ^11.3.1

  # Servicio en primer plano (baliza persistente)
  flutter_foreground_task: ^8.10.0

  # Estado
  provider: ^6.1.1

  # Navegación
  go_router: ^13.2.0

  # Utilidades
  http: ^1.2.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-app-1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo-app-1024.png"
    background_color: "#12355B"
    theme_color: "#12355B"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
